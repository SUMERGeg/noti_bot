services:
  - type: web
    name: ryadom-reminders
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEV_MODE
        value: "false"
      - key: LOCAL_SCHEDULER
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: JOB_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: OWNER_TELEGRAM_ID
        value: "0"
